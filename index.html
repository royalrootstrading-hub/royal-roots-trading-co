<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Royal Roots Trading &amp; Co. — building materials and construction solutions.">
<meta name="theme-color" content="#071b62">
<title>Royal Roots Trading &amp; Co.</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font:16px/1.5 Arial,sans-serif;text-align:center;color:#071b62;background:#fff}a{color:#12358e}
</style>
</head>
<body>
<main id="rr-loading">
<h1>ROYAL ROOTS TRADING &amp; CO.</h1>
<p>Opening the website…</p>
<p>If the website does not open, <a href="./legacy-site.html">open the website directly</a>.</p>
</main>
<script>
(async function(){
  try {
    const response = await fetch("./legacy-site.html?content-refresh=20261021-1", {cache:"no-store"});
    if (!response.ok) throw new Error("Website content could not be loaded (" + response.status + ").");
    let html = await response.text();
    // Remove older CMS script tags so the current cache-busted versions always run.
    html = html.replace(/<script\b[^>]*src=["'][^"']*supabase-config\.js[^"']*["'][^>]*>\s*<\/script>/gi, "");
    html = html.replace(/<script\b[^>]*src=["'][^"']*site-cms\.js[^"']*["'][^>]*>\s*<\/script>/gi, "");
    html = html.replace(/<script\b[^>]*src=["'][^"']*site-videos-public\.js[^"']*["'][^>]*>\s*<\/script>/gi, "");
    // Responsive safety net for phones and tablets.
    const mobileFix = `<style id="rr-mobile-layout-fix">
      *,*::before,*::after{box-sizing:border-box}
      html{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
      body{width:100%;max-width:100%;margin:0;overflow-x:hidden}
      img,video,iframe,svg,canvas{max-width:100%}
      img,video{height:auto}
      iframe{display:block}
      section,main,header,footer,nav,.container,.row,[class*="container"]{max-width:100%}
      input,select,textarea,button{max-width:100%;font:inherit}
      @media(max-width:768px){
        /* Fix oversized blank video section below mobile navigation. */
        #video{height:auto!important;min-height:0!important;max-height:none!important;margin-top:0!important;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important;overflow:hidden!important;display:flow-root!important} #video>*,#video .section-inner,#video .video-content{height:auto!important;min-height:0!important;max-height:none!important;margin-top:0!important;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important}
        #video iframe,#video video{display:block;width:100%!important;max-width:100%!important;height:auto!important;aspect-ratio:16/9;max-height:220px!important}
        #video .container,#video .row,#video [class*=container],#video [class*=wrapper],#video [class*=embed]{height:auto!important;min-height:0!important;max-height:none!important;padding-top:0!important;padding-bottom:0!important;margin-top:0!important;margin-bottom:0!important}
        #video:empty{display:none!important}
        /* Hide a stale empty video placeholder instead of leaving a tall white block. */
        .video-placeholder:empty,.video-placeholder:has(iframe),.video-placeholder:has(video){height:auto!important;min-height:0!important}

        /* Collapse oversized embedded video areas on mobile */
        iframe{max-height:220px!important}
        [class*=video-container],[class*=video-wrapper],[class*=video-embed],[class*=youtube-embed],[class*=embed-responsive],[class*=embed-container]{height:auto!important;min-height:0!important;max-height:none!important;padding-bottom:0!important}
        [class*=video-container] iframe,[class*=video-wrapper] iframe,[class*=video-embed] iframe,[class*=youtube-embed] iframe,[class*=embed-responsive] iframe,[class*=embed-container] iframe{width:100%!important;height:auto!important;aspect-ratio:16/9;max-height:220px!important}

        body{font-size:16px}
        .container,.nav-container,.navbar .container,.hero,.section,.section-inner{width:100%!important;max-width:100%!important}
        section{scroll-margin-top:80px}
        h1{font-size:clamp(1.8rem,7vw,2.7rem);line-height:1.15}
        h2{font-size:clamp(1.4rem,5.5vw,2rem);line-height:1.2}
        p{overflow-wrap:anywhere}
        .row{margin-left:0!important;margin-right:0!important}
        .hero,.hero-content{padding-left:18px!important;padding-right:18px!important}
        .gallery-grid,.feature-grid,.rr-live-products-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}
        .gallery-grid>*,.feature-grid>*,.rr-live-product-card{min-width:0}
        .gallery-grid img,.feature-grid img{max-width:100%;object-fit:cover}
        iframe[src*="youtube"],iframe[src*="youtu.be"],iframe[src*="facebook"],video,.video-container,.video-wrapper,.video-frame,.responsive-video{width:100%!important;max-width:100%!important;aspect-ratio:16/9;height:auto!important;min-height:0!important}
        iframe[src*="youtube"],iframe[src*="youtu.be"]{height:auto!important}
        #rr-social-footer{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
        #rr-social-footer nav{flex-wrap:wrap;gap:6px!important;justify-content:center!important}
        #rr-social-footer a{min-height:28px!important;height:auto!important;padding:4px 8px!important;font-size:12px!important;line-height:1.2!important;gap:5px!important;border-radius:14px!important;display:inline-flex!important;align-items:center!important} #rr-social-footer svg,#rr-social-footer img{width:15px!important;height:15px!important;max-width:15px!important;max-height:15px!important}
        .whatsapp-float,.whatsapp-button,[class*="whatsapp"]{max-width:calc(100vw - 24px)}
      }
      @media(max-width:420px){
        .gallery-grid,.feature-grid,.rr-live-products-grid{grid-template-columns:minmax(0,1fr)!important}
        header .brand img,header .logo img{max-width:min(62vw,220px)!important;height:auto!important}
        button,a{touch-action:manipulation}
      }
    </style>`;
    if (/<head\b[^>]*>/i.test(html)) html = html.replace(/<head\b[^>]*>/i, match => match + mobileFix);
    const scripts = [
      '<script src="./supabase-config.js?v=20261021-1"><\/script>',
      '<script type="module" src="./site-cms.js?v=20261021-1"><\/script>',
      '<script type="module" src="./site-videos-public.js?v=20261021-1"><\/script>'
    ];
    if (scripts.length) {
      const additions = scripts.join("\n");
      if (/<\/body\s*>/i.test(html)) html = html.replace(/<\/body\s*>/i, additions + "\n</body>");
      else html += additions;
    }
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    const main = document.getElementById("rr-loading");
    if (main) {
      const p = document.createElement("p");
      p.textContent = "The website could not load automatically. Please use the direct link below or refresh in a moment.";
      main.append(p);
      console.error("Royal Roots website loader:", error);
    }
  }
})();
</script>
</body>
</html>
