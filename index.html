<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Royal Roots Trading & Co. — building materials and construction solutions.">
<title>Royal Roots Trading &amp; Co.</title>
<style>body{font:16px Arial,sans-serif;color:#071b62;display:grid;place-items:center;min-height:80vh;text-align:center;padding:24px}a{color:#12358e}</style>
</head>
<body>
<main><h1>ROYAL ROOTS TRADING &amp; CO.</h1><p id="status">Loading the Royal Roots website…</p><noscript>JavaScript is required to load the website. <a href="./legacy-site.html">Open the original site</a>.</noscript></main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try {
   const response=await fetch('./legacy-site.html',{cache:'no-cache'});
   if(!response.ok) throw new Error('Website content could not be loaded.');
   let html=await response.text();
   const endTag="</scr"+"ipt>";
   const additions='\n<script src="./supabase-config.js">'+endTag+'\n<script type="module" src="./products.js">'+endTag+'\n<script type="module" src="./site-cms.js">'+endTag+'\n<script type="module" src="./site-videos-public.js">'+endTag+'\n';
   html=html.replace(new RegExp("</body>","i"), additions+"</body>");
   const socialTabs = `
<style>
#rr-social-tabs{position:fixed;right:18px;bottom:18px;z-index:2147483000;display:flex;gap:10px;align-items:center;font:600 14px/1.2 Arial,sans-serif}
#rr-social-tabs a{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:999px;color:#fff;text-decoration:none;box-shadow:0 4px 16px #0003;transition:transform .15s,opacity .15s}
#rr-social-tabs a:hover{transform:translateY(-2px);opacity:.92}
#rr-social-tabs .rr-instagram{background:linear-gradient(45deg,#feda75,#d62976,#962fbf,#4f5bd5)}
#rr-social-tabs .rr-youtube{background:#c00}
#rr-social-tabs svg{width:18px;height:18px;fill:currentColor}
@media(max-width:480px){#rr-social-tabs{right:10px;bottom:10px;gap:7px}#rr-social-tabs a{padding:11px 12px;font-size:13px}}
</style>
<nav id="rr-social-tabs" aria-label="Follow Royal Roots on social media">
<a class="rr-instagram" href="https://www.instagram.com/experienceroyalroots/" target="_blank" rel="noopener noreferrer" aria-label="Open Royal Roots on Instagram">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2.2A2.8 2.8 0 0 0 4.2 7v10A2.8 2.8 0 0 0 7 19.8h10a2.8 2.8 0 0 0 2.8-2.8V7A2.8 2.8 0 0 0 17 4.2H7zm5 2.3a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm0 2.2a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6zm5.7-3.1a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6z"/></svg>
Instagram</a>
<a class="rr-youtube" href="https://www.youtube.com/results?search_query=Royal+Roots+Trading+%26+Co" target="_blank" rel="noopener noreferrer" aria-label="Search YouTube for Royal Roots Trading and Company">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
YouTube</a>
</nav>`;
   html=html.replace(new RegExp("</body>","i"), socialTabs+"</body>");
   document.open(); document.write(html); document.close();
 } catch(e) {
   status.textContent='The website could not load right now.';
   const link=document.createElement('a');link.href='./legacy-site.html';link.textContent='Open the original website';
   status.after(link);
   console.error(e);
 }
})();
</script>
</body></html>
